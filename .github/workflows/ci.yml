name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Python bytecode compilation & syntax check
        run: |
          python -m compileall src/ api/ tests/

      - name: Validate frontend dashboard HTML
        run: |
          test -f frontend/dashboard.html
          python -c "
          from html.parser import HTMLParser
          class Validator(HTMLParser): pass
          with open('frontend/dashboard.html', 'r', encoding='utf-8') as f:
              Validator().feed(f.read())
          print('frontend/dashboard.html syntax valid')
          "

      - name: Run automated test suite
        run: |
          python -m pytest tests/ -v --tb=short

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t fraudlens-api:latest .
